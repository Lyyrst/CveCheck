services:
  postgres:
    image: postgres:18-alpine
    container_name: cvecheck-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - cvecheck_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvecheck_user -d cvecheck_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cvecheck_pgdata: